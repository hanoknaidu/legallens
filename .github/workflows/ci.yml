# =============================================================================
# Legal Lens — CI
# =============================================================================
# What this pipeline is: the pre-merge gate. Five independent jobs fan out from
# a checkout, and a sixth collapses their verdicts into one required status
# check:
#
#     quality    read the backend source without running it (ruff lint+format)
#     test       run the unit suite on py3.12 and py3.14, publish HTML reports
#     docker     build the production image and prove it boots and reports ok
#     frontend   lint, typecheck and build the bundle that actually ships
#     e2e-specs  prove the 73 Playwright specs still load and collect
#     retrieval  the tests that load real models and a real vector store
#        \__________________ all six _____________________/
#                              |
#                             ci   the one check branch protection requires
#
# What it deliberately does not do: publish anything. No registry push, no
# package release, no PR comment — the token below is read-only and CD owns
# everything downstream of a green run.
#
# What used to live elsewhere: the retrieval tests had their own workflow,
# ci-retrieval.yml, kept out of the gate because the `workflows` extra pulls
# torch and the CUDA runtime and the suite was expected to download ~4.5GB of
# model weights on its first question. Measured, it does not: the first run ever,
# on a cold cache with nothing to restore, finished in 1m35s with 34 tests
# passing in 23.73s of test time. The reason for keeping it separate did not
# survive the numbers, and a suite outside the required check is one that can go
# red without stopping a merge — so it is a job here now, and it blocks.
#
# What is deliberately not gated: running the e2e suite, and the standalone
# intent classifier. Both need a real ANTHROPIC_API_KEY — the e2e run cost $1.35
# over 114 model calls when it was measured, and every `classify.py` invocation
# is a vendor call. A gate that needs a secret and spends money on every PR is a
# gate people turn off, so this workflow checks what it can without one: that
# the specs compile and collect, and that `classify.py` byte-compiles. The one
# real cross-component assertion is already in the unit suite, where
# test_conversation_titles.py and test_orchestrator_intent.py read `frontend/`
# and `intent-classifier/` and fail on drift.
#
# Each section below carries its own notes on why it is shaped the way it is;
# this header is only the shape.
# =============================================================================

name: CI

# The gate on main.
#
# `pull_request` is the trigger that actually guards a merge: GitHub runs it
# against the *merge result*, not the branch tip, so it catches the change that
# only breaks once combined with main. The `push` entry re-runs the same checks
# on the commit that landed, which is the signal a CD pipeline reads later.
#
# Note on scope: each job sets its own `working-directory`, because no component
# lives at the repository root — `backend/` for the three Python jobs,
# `frontend/` and `e2e/` for theirs. Paths handed to an action are spelled from
# the root instead, since an action's inputs ignore `working-directory`.
#
# No `paths` filter here on purpose. This is the required status check, and a
# path-filtered required check never reports on a PR outside its filter, which
# leaves branch protection waiting on a check that will never arrive. Every job
# runs on every PR; the slowest is about a minute.
#
# The `schedule` entry arrived with the retrieval job when ci-retrieval.yml was
# folded in. Its purpose was to surface a break from a dependency bump within a
# day, and running the whole gate daily is a superset of that. Two things worth
# knowing: a scheduled run only ever fires from the default branch, and GitHub
# disables the schedule after 60 days of repository inactivity.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 07:00 UTC daily.
    - cron: "0 7 * * *"
  workflow_dispatch:

# A second push to a PR makes the first run's verdict irrelevant, so stop it and
# save the runner. `github.ref` is per-PR, so cancelling a PR's run can never
# cancel the run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here writes to the repository, publishes a package or
# comments on a PR. CD will need more than this and should request it in its own
# workflow rather than widening the gate's token.
permissions:
  contents: read

env:
  # Pinned to the uv that wrote uv.lock, which is also the one the Dockerfile
  # copies (`ghcr.io/astral-sh/uv:0.12.23`). A newer uv can resolve or rewrite
  # the lockfile differently, which would let CI pass against a dependency set
  # the production image never builds.
  UV_VERSION: "0.12.23"

  FORCE_COLOR: "1"

# The extras the suite needs are spelled out in full at each call site below
# (`--extra dev --extra ocr --extra orchestrator`) rather than held in an env var.
# An env var holding several flags only works in a shell that word-splits it:
# Actions' default bash does, but zsh — the macOS default — does not, so the var
# version of these commands fails when a developer copies it out of here to
# reproduce a red build locally. Three repetitions is the cheaper problem.
#
# Why those three: `dev` alone is not enough. Without `ocr` the OCR pipeline tests
# fail on a lazy `import pymupdf`, and without `orchestrator` the intent and
# rewrite tests fail on `import langchain_anthropic` — 18 failures and 11 errors
# between them, because those imports sit inside functions and so are invisible
# at collection time.
#
# `workflows` is deliberately absent from those three: it pulls torch, the CUDA
# runtime and triton for the 34 retrieval tests, which `importorskip` themselves
# without it. The `retrieval` job below installs it and runs them, so they are
# gated — just not four times over, once per interpreter and once per extras set.

jobs:
  # ---------------------------------------------------------------------------
  # Quality: the checks that read the source without running it.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The gate's commands all run in `backend/`, the only part of the repository
    # this workflow checks. This applies to `run:` steps only — an action's own
    # inputs ignore it, which is why the paths handed to setup-uv, build-push and
    # upload-artifact below are spelled out relative to the repository root.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version, not `@v10`: astral-sh stopped publishing the
      # floating major tag after v7, so `@v10` resolves to nothing and the job
      # fails at "Set up job" before a single step runs.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.14"

      # `--extra dev` only: ruff reads the source, it does not import it, so
      # installing ocr/orchestrator here would be install time spent for nothing.
      # `--frozen` makes uv use uv.lock exactly and fail if pyproject.toml has
      # drifted from it, which turns "edited pyproject.toml without relocking"
      # into a CI failure instead of a silent re-resolve.
      #
      # --output-format=github puts each violation on the PR diff as an
      # annotation, so a reviewer sees it in the file rather than in the log.
      - name: Lint (ruff check)
        run: uv run --frozen --extra dev ruff check --output-format=github .

      # Blocking. The repository was formatted in one mechanical pass when this
      # pipeline was added (52 files reformatted, 63 already clean, and the suite
      # unchanged at 358 passed), so the tree is clean and any drift from here is
      # a real diff rather than a backlog.
      #
      # `ruff format` and `ruff check` disagree about nothing here: the lint rule
      # set (E, F, I, UP, B, ASYNC) contains no stylistic rule the formatter also
      # owns, so the two cannot fight over the same line.
      #
      # If this fails: run `uv run ruff format .` and commit the result.
      - name: Format (ruff format --check)
        run: uv run --frozen --extra dev ruff format --check .

      # `intent-classifier/` is a standalone script with one dependency and no
      # uv, and it cannot be run here: every invocation is a real Anthropic call.
      # Byte-compiling it is the most that can be checked without a key, and it
      # still catches the syntax error that would otherwise reach whoever runs
      # the suite by hand. Drift between its prompt and the backend's copy is
      # already asserted by test_orchestrator_intent.py in the `test` job.
      - name: Byte-compile the standalone intent classifier
        working-directory: intent-classifier
        run: python3 -m compileall -q classify.py

  # ---------------------------------------------------------------------------
  # Tests: the unit suite, with the HTML reports attached to the run.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    strategy:
      # Both versions report. Otherwise the first failure cancels the other and
      # hides whether the break is version-specific, which is the one thing a
      # two-version matrix exists to tell you.
      fail-fast: false
      matrix:
        # 3.14 is what .venv, the Dockerfile and production run. 3.12 is the floor
        # pyproject.toml declares (`requires-python = ">=3.12"`); testing it is
        # what keeps that floor honest rather than aspirational.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version, not `@v10`: astral-sh stopped publishing the
      # floating major tag after v7, so `@v10` resolves to nothing and the job
      # fails at "Set up job" before a single step runs.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: ${{ matrix.python }}

      # No secrets, by construction. conftest.py builds
      # `Settings(environment="test", llm_provider="echo")`, the startup LLM probe
      # is skipped under that environment, and no test makes a network call — so
      # there is no ANTHROPIC_API_KEY here and nothing asks for one. There is also
      # no `.env` in a clean checkout (it is gitignored), which is why
      # `Settings`' `env_file=".env"` reads nothing and the defaults apply.
      #
      # Expect: 336 passed, 1 skipped. The one skip is structural, not a failure
      # — the `workflows` extra is absent by design, so the retrieval tests
      # `importorskip` themselves and the `retrieval` job runs them instead. The two
      # tests that read `frontend/` and `intent-classifier/` are in the 336: both
      # folders are in this repository, so they assert rather than skip. `-rs`
      # prints each reason into the log so a new skip is visible rather than
      # silently absorbed.
      - name: Run tests
        # A shared runner is slower than any developer machine, and the ingestion
        # polling budget in tests/helpers.py is tight by design. 60s here is not a
        # looser assertion — a pipeline that genuinely stalls still fails, it just
        # no longer fails because the runner was busy.
        env:
          LEGAL_LENS_TEST_TERMINAL_TIMEOUT_S: "60"
        run: |
          uv run --frozen --extra dev --extra ocr --extra orchestrator \
            pytest \
              --cov \
              --cov-report=term-missing:skip-covered \
              --cov-report=html:reports/coverage \
              --cov-report=xml:reports/coverage.xml \
              --html=reports/pytest-report.html \
              --self-contained-html \
              --junitxml=reports/junit.xml \
              -q -rs

      # `always()`: a failing suite is precisely when the coverage table is worth
      # reading, so it is published even though the step above failed. The
      # `.coverage` guard covers the case where pytest died before writing any.
      - name: Publish the coverage table to the run summary
        if: always()
        run: |
          if [ ! -f .coverage ]; then
            echo "### Coverage (py${{ matrix.python }}): no data — the suite did not get far enough" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Same extras as the test step on purpose: a different set here would
          # make uv re-sync the environment just to read a file it already wrote.
          total="$(uv run --frozen --extra dev --extra ocr --extra orchestrator coverage report --format=total)"
          {
            echo "### Coverage (py${{ matrix.python }}): ${total}%"
            echo
            echo "<details><summary>Per-file breakdown</summary>"
            echo
            uv run --frozen --extra dev --extra ocr --extra orchestrator coverage report --format=markdown
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # The browsable reports: pytest-report.html is one self-contained file, and
      # coverage/index.html is the line-by-line view. Uploaded on failure too,
      # for the same reason as the summary above.
      - name: Upload the HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-py${{ matrix.python }}
          path: backend/reports/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Frontend: typecheck and build the bundle that ships.
  # ---------------------------------------------------------------------------
  # There is no unit-test step because the project has none — `package.json`
  # defines dev, build, preview, typecheck and lint, and that is all.
  # `typecheck` and `build` overlap (`build` is `tsc -b && vite build`)
  # and both are here anyway: the separate typecheck reports a type error as a
  # type error rather than as a failed build, and the build is what catches the
  # thing tsc cannot see, such as an unresolvable import or a Tailwind/Vite
  # plugin failure.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # From `.nvmrc` at the repository root rather than a literal here, so
          # CI and `nvm use` cannot drift apart. It sits at the root, not in
          # frontend/, because `e2e/` is a Node project too and nvm reads the
          # nearest .nvmrc walking up from the working directory.
          node-version-file: .nvmrc
          # npm's own cache, keyed on the lockfile. Spelled from the repository
          # root: an action's inputs ignore `working-directory`.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: it installs the lockfile exactly and fails
      # if package.json has drifted from it, which is the same guarantee
      # `--frozen` gives uv in the Python jobs. It also deletes node_modules
      # first, so nothing from a warm cache can mask a missing dependency.
      - name: Install
        run: npm ci

      # The script carries `--max-warnings 9`, which is the count the repository
      # had when ESLint was introduced. It is a ratchet, not a target: a tenth
      # warning fails this job, and working one of the nine off means lowering
      # the number. See the note in eslint.config.js for what the nine are and
      # why they are warnings rather than errors.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # VITE_USE_MOCKS is inlined at build time, and the default is false — the
      # real-backend bundle is the one that ships, so that is the one built here.
      - name: Build
        run: npm run build

      # The bundle, for a reviewer who wants to check a size regression without
      # building it themselves. `always()` is pointless here: there is nothing
      # to upload if the build failed.
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Docker: prove the image still builds and still boots.
  # ---------------------------------------------------------------------------
  # Without this the gate can go green on a change that breaks the thing that
  # actually ships — the suite imports from `src/`, it never exercises the
  # Dockerfile. The default `EXTRAS=""` build is the one checked, because that is
  # the configuration that boots with no local model and no vector server; the
  # `workflows` build is 6.42GB and belongs nowhere near a PR gate.
  #
  # This builds and boots but never pushes. Publishing is CD's job and needs a
  # registry credential this workflow deliberately does not have.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # buildx, because the default docker driver cannot use the GitHub Actions
      # cache backend that makes the second build cheap.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # `load: true` puts the image into the local daemon so the next step can
      # actually run it. Without it the build stays in buildx's cache and there
      # is nothing to boot.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: legallens-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds and an image that boots are different claims, and
      # the gap between them is where a bad ENTRYPOINT or a missing runtime file
      # lives. `LEGAL_LENS_LLM_PROVIDER=echo` is what makes this possible without
      # a secret: it needs no key at all, and `environment=test` skips the
      # startup probe that would otherwise make one vendor call.
      #
      # Verified locally against this image: healthy in 2s, every check `ok`.
      - name: Smoke-test the image
        run: |
          docker run -d --rm -p 8000:8000 \
            -e LEGAL_LENS_LLM_PROVIDER=echo \
            -e LEGAL_LENS_ENVIRONMENT=test \
            --name ll-smoke legallens-backend:ci

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health -o health.json; then
              echo "Healthy after ${i}s."
              cat health.json
              # Responding is not the same as being well: a degraded check still
              # returns 200, so assert on the status field rather than on curl.
              grep -q '"status":"ok"' health.json || {
                echo "::error::/api/health answered but did not report ok"
                exit 1
              }
              {
                echo "### Docker image"
                echo
                echo "Built and booted. \`/api/health\` after ${i}s:"
                echo
                echo '```json'
                cat health.json
                echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 1
          done

          echo "::error::the container never became healthy within 60s"
          docker logs ll-smoke || true
          exit 1

      # `always()`: if the step above timed out, the container is still running
      # and still holding port 8000.
      - name: Stop the container
        if: always()
        run: docker rm -f ll-smoke || true

  # ---------------------------------------------------------------------------
  # E2E specs: collected, not run.
  # ---------------------------------------------------------------------------
  # `--list` loads every spec and reports what it would run, without starting a
  # browser, a backend or a frontend. That makes it free and keyless, and it
  # still catches the failure that matters most between full e2e runs: a spec
  # that no longer compiles or imports, which otherwise surfaces only when
  # someone runs the suite by hand and finds a file missing from the count.
  #
  # Expect: 73 tests in 9 files. The step asserts the file count rather than just
  # exit zero, because `--list` succeeds on a half-collected suite. Change this number
  # when a spec file is added or removed, which is the point — a file that stops being
  # collected should fail here rather than quietly vanish.
  #
  # Actually running these needs a real key, a built frontend and a live
  # backend, and cost $1.35 over 114 model calls when last measured — see
  # docs/e2e-test-report.md. That belongs in a scheduled or dispatched workflow
  # with a secret, not in a PR gate.
  e2e-specs:
    name: E2E specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # No `playwright install`: collection needs the test runner, not a
      # browser. Skipping it is the difference between a ten-second job and a
      # two-minute one.
      - name: Install
        run: npm ci

      - name: Collect the specs
        run: |
          npx playwright test --list | tee /tmp/listing.txt
          grep -qE "Total: [0-9]+ tests in 9 files" /tmp/listing.txt || {
            echo "::error::expected 9 spec files; the suite did not collect in full"
            exit 1
          }

  # ---------------------------------------------------------------------------
  # Retrieval: the only tests that load real models and a real vector store.
  # ---------------------------------------------------------------------------
  # The 34 tests in test_orchestrator_retrieval.py and
  # test_orchestrated_retrieval.py. They need the `workflows` extra — torch, the
  # CUDA runtime, triton — which is why the other Python jobs leave it out, and
  # why those tests `importorskip` themselves there and account for the `test`
  # job's one structural skip.
  #
  # This was ci-retrieval.yml. Folded in because the cost it was avoiding turned
  # out not to be real, and because advisory was the worse trade: it could go red
  # without blocking anything.
  retrieval:
    name: Retrieval tests (real models)
    runs-on: ubuntu-latest
    # Was 60 when this job blocked nothing. The aggregate waits on it now, so a
    # hang holds a PR for as long as this allows and the bound is nearer what the
    # job takes: ~20x headroom over the observed 1m35s, which still covers a cold
    # run fetching multi-GB wheels.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Pin the model caches to paths the cache step can restore. HF_HOME is
      # respected by sentence-transformers, which loads the embedder and the
      # reranker. FASTEMBED_CACHE_PATH steers fastembed's BM25 weights
      # (Qdrant/bm25, small); if the installed fastembed ignores it, that cache
      # simply misses and re-downloads — it does not break the run.
      HF_HOME: /home/runner/.cache/huggingface
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      # Keep torch off the GPU paths it would look for on a CPU runner.
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          # Only 3.14 here, matching the Dockerfile and .venv. The point of this
          # job is the retrieval stack, not interpreter coverage, and doubling it
          # would double a multi-GB install.
          python-version: "3.14"

      # Keyed on the model names rather than the lockfile: the weights change
      # when DEFAULT_EMBED_MODEL / DEFAULT_RERANK_MODEL change, not when a wheel
      # does. restore-keys lets a run with a changed key start from the last
      # download instead of from nothing.
      - name: Restore the model cache
        uses: actions/cache@v6
        with:
          path: |
            /home/runner/.cache/huggingface
            /home/runner/.cache/fastembed
          key: models-${{ runner.os }}-bge-m3-bge-reranker-v2-m3-qdrant-bm25
          restore-keys: |
            models-${{ runner.os }}-

      # `workflows` on top of the standard set. This is the install that costs
      # minutes; the two cache steps above exist to make it cheap on a rerun.
      - name: Run the retrieval tests
        env:
          # Same reason as the `test` job: a shared runner is slower than any
          # developer machine, and the polling budget in tests/helpers.py is
          # tight by design.
          LEGAL_LENS_TEST_TERMINAL_TIMEOUT_S: "60"
        run: |
          uv run --frozen \
            --extra dev --extra ocr --extra orchestrator --extra workflows \
            pytest tests/test_orchestrator_retrieval.py tests/test_orchestrated_retrieval.py \
              --html=reports/retrieval-report.html \
              --self-contained-html \
              --junitxml=reports/retrieval-junit.xml \
              -q -rs

      # No coverage here: this job runs two files, so its percentage would read
      # as a project total while measuring a slice of it. The `test` job owns the
      # coverage number.
      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-retrieval-reports
          path: backend/reports/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The single check to require in branch protection.
  # ---------------------------------------------------------------------------
  # A matrix job's name carries the matrix value ("Tests (py3.12)"), so requiring
  # those by name breaks the moment the matrix changes. This job's name does not
  # move. `if: always()` plus an explicit result test is what makes a skipped or
  # cancelled dependency count as a failure — `needs` alone treats "skipped" as
  # satisfied, which would turn a cancelled run into a green merge.
  ci:
    name: CI
    if: always()
    needs: [quality, test, docker, frontend, e2e-specs, retrieval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to have succeeded
        run: |
          echo "quality:   ${{ needs.quality.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "docker:    ${{ needs.docker.result }}"
          echo "frontend:  ${{ needs.frontend.result }}"
          echo "e2e-specs: ${{ needs.e2e-specs.result }}"
          echo "retrieval: ${{ needs.retrieval.result }}"
          [ "${{ needs.quality.result }}" = "success" ] || exit 1
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.docker.result }}" = "success" ] || exit 1
          [ "${{ needs.frontend.result }}" = "success" ] || exit 1
          [ "${{ needs['e2e-specs'].result }}" = "success" ] || exit 1
          [ "${{ needs.retrieval.result }}" = "success" ] || exit 1
          echo "All required checks passed."
