# =============================================================================
# Legal Lens — CD
# =============================================================================
# What this pipeline is: the deploy. It builds both images for the commit CI just
# passed, pushes them to ACR tagged with the git SHA, and rolls them out to AKS.
#
#     build-and-push   two images -> ACR, tagged <sha>
#            |
#          deploy      kubectl apply -> AKS, wait for rollout, roll back if it fails
#
# What triggers it: CI finishing successfully on `main` — not a push to `main`.
# A `push` trigger would run this in parallel with the tests, so a commit could
# reach the cluster before anything had verified it. `workflow_run` waits for the
# verdict and reads it.
#
# What it never does: build an image tagged `latest`. A moving tag makes "what is
# running in the cluster?" unanswerable and makes rollback guesswork. Every image
# here carries the SHA it was built from, so a running pod names its own commit.
#
# What it needs from Azure: a federated credential, so there is no password or
# client secret stored in GitHub. See CD_readme.md, "Setting up CD".
# =============================================================================

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Re-deploy the current `main` on demand — after a cluster rebuild, or to retry a
  # deploy that failed for an infrastructure reason rather than a code one.
  workflow_dispatch:

# One deploy at a time, and never cancel one midway: `cancel-in-progress` here
# would abort a `kubectl apply` after it had changed some objects and not others,
# leaving the cluster in a state no commit describes. A queued second deploy is the
# lesser problem.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  # Required for OIDC federation: this is what lets the workflow mint a token Azure
  # will trust, instead of holding a client secret.
  id-token: write
  contents: read

env:
  BACKEND_REPOSITORY: legallens-backend
  FRONTEND_REPOSITORY: legallens-frontend

jobs:
  # ---------------------------------------------------------------------------
  # Guard: only deploy what passed.
  # ---------------------------------------------------------------------------
  # `workflow_run` fires on *completion*, success or failure, so the conclusion has
  # to be tested explicitly. A manual `workflow_dispatch` has no upstream run and is
  # allowed through on the operator's judgement.
  #
  # This also resolves the commit to deploy, once, so every later step agrees on it.
  # Under `workflow_run` that is the upstream run's head SHA — `github.sha` would be
  # the default branch tip, which is usually the same commit and silently is not
  # when two merges land close together.
  resolve:
    name: Resolve the commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      short: ${{ steps.pick.outputs.short }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=${sha}"            >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}"      >> "$GITHUB_OUTPUT"
          echo "Deploying ${sha}"      >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build both images and push them to ACR.
  # ---------------------------------------------------------------------------
  # Rebuilt here rather than carried over from CI. CI is deliberately secretless
  # (backend/CI.md) — it has no registry credential and cannot push — and handing a
  # built image between workflows means uploading and re-importing a tarball. A
  # rebuild from the same SHA produces the same image and costs about a minute with
  # the layer cache warm.
  build-and-push:
    name: Build and push
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI passed, not whatever `main` points at now.
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # linux/amd64 explicitly, even though the runner is already x86. It is the
      # platform AKS nodes run, and stating it means a future move to arm runners
      # cannot silently start producing images the cluster cannot execute.
      # `EXTRAS` selects the dependency set baked into the image: empty is the
      # default stack, "orchestrator workflows" adds torch and the real retrieval
      # models and takes the image from 195MB to 6.42GB (backend/DOCKER.md). The
      # build is correspondingly slower — minutes, not seconds — which is why the
      # cache scope below is keyed on it: switching stacks must not serve a cached
      # layer built for the other one.
      - name: Build and push the backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          build-args: |
            EXTRAS=${{ vars.BACKEND_EXTRAS }}
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.BACKEND_REPOSITORY }}:${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=backend-${{ vars.BACKEND_EXTRAS || 'default' }}
          cache-to: type=gha,mode=max,scope=backend-${{ vars.BACKEND_EXTRAS || 'default' }}

      - name: Build and push the frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_REPOSITORY }}:${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Summarise
        run: |
          {
            echo "### Images pushed"
            echo
            echo '```'
            echo "${{ vars.ACR_NAME }}.azurecr.io/${{ env.BACKEND_REPOSITORY }}:${{ needs.resolve.outputs.sha }}"
            echo "${{ vars.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_REPOSITORY }}:${{ needs.resolve.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Roll it out.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AKS
    needs: [resolve, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Point GitHub's environment protection rules at this name if a manual approval
    # gate is ever wanted. Unprotected, it only labels the deployment in the UI.
    environment:
      name: production
      url: ${{ steps.address.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_NAME }}" \
            --overwrite-existing
          kubectl version --client
          kubectl get nodes

      # The API key, kept current in the cluster from one place. `apply` rather than
      # `create` so re-running is not an error, and `--dry-run=client -o yaml | apply`
      # because `kubectl create secret` has no upsert of its own.
      #
      # If the repository has no ANTHROPIC_API_KEY, this is skipped and the backend
      # is deployed with the echo provider: a deterministic stub that makes no vendor
      # call. That is what lets the whole pipeline be proven without a key or spend.
      # Everything the retrieval stack changes, derived in one place from one
      # variable. The alternative — asking an operator to remember to raise the
      # memory limit and the disk when they change the extras — is four coordinated
      # edits, and the failure when one is missed is an OOMKill twenty minutes into
      # a demo.
      - name: Work out the deployment shape
        id: shape
        env:
          EXTRAS: ${{ vars.BACKEND_EXTRAS }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if echo "${EXTRAS}" | grep -q "workflows"; then
            # bge-m3 plus the cross-encoder reranker are ~2.5GB resident before the
            # application's own use, and HF_HOME lives on the volume.
            {
              echo "stack=full retrieval (orchestrator)"
              echo "memory_request=3Gi"
              echo "memory_limit=8Gi"
              echo "cpu_request=500m"
              echo "volume_size=32Gi"
            } >> "$GITHUB_OUTPUT"
            heavy=true
          else
            {
              echo "stack=default (hashing embeddings, in-memory store)"
              echo "memory_request=512Mi"
              echo "memory_limit=2Gi"
              echo "cpu_request=250m"
              echo "volume_size=8Gi"
            } >> "$GITHUB_OUTPUT"
            heavy=false
          fi

          # The provider follows from the two inputs: no key means the echo stub
          # whatever is installed, and the orchestrator provider needs the extras
          # that are only present in the heavy image.
          if [ "${HAS_KEY}" != "true" ]; then
            provider=echo
          elif [ "${heavy}" = "true" ]; then
            provider=orchestrator
          else
            provider=anthropic
          fi
          echo "provider=${provider}" >> "$GITHUB_OUTPUT"
          echo "Deploying the ${provider} provider." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the API key secret
        id: secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "No ANTHROPIC_API_KEY secret — the echo provider needs none."
            exit 0
          fi
          kubectl create secret generic legallens-secrets \
            --from-literal=ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # envsubst rather than Helm or Kustomize. There are three manifests and one
      # substituted value in each; a chart would add a templating language, a values
      # file and a release lifecycle to express `image: <this tag>`. The moment
      # there are several environments to differentiate, that calculation changes —
      # see CD_readme.md, "Why not Helm".
      #
      # `-i ''` restricts substitution to exactly these names, so a `$` in any
      # manifest — a shell snippet in an env var, a regex — survives untouched.
      - name: Apply the manifests
        env:
          BACKEND_IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.BACKEND_REPOSITORY }}:${{ needs.resolve.outputs.sha }}
          FRONTEND_IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_REPOSITORY }}:${{ needs.resolve.outputs.sha }}
          LLM_PROVIDER: ${{ steps.shape.outputs.provider }}
          DATA_VOLUME_SIZE: ${{ steps.shape.outputs.volume_size }}
          BACKEND_MEMORY_REQUEST: ${{ steps.shape.outputs.memory_request }}
          BACKEND_MEMORY_LIMIT: ${{ steps.shape.outputs.memory_limit }}
          BACKEND_CPU_REQUEST: ${{ steps.shape.outputs.cpu_request }}
        run: |
          names='${BACKEND_IMAGE} ${FRONTEND_IMAGE} ${LLM_PROVIDER} ${DATA_VOLUME_SIZE}'
          names="${names} "'${BACKEND_MEMORY_REQUEST} ${BACKEND_MEMORY_LIMIT} ${BACKEND_CPU_REQUEST}'
          for manifest in k8s/pvc.yaml k8s/backend.yaml k8s/frontend.yaml; do
            envsubst "${names}" < "${manifest}" \
              | tee "/tmp/$(basename "${manifest}")" | kubectl apply -f -
          done

      # The apply above only says Kubernetes accepted the objects. Whether the new
      # pods actually started is a different claim, and it is the one that matters:
      # an image that crash-loops is accepted by the API server and never becomes
      # ready.
      - name: Wait for the rollout
        id: rollout
        run: |
          # 20 minutes, not 5: the full retrieval image is 6.42GB and the node has
          # to pull it before the container starts. Returns as soon as the rollout
          # settles, so this costs nothing on the small image.
          kubectl rollout status deployment/backend  --timeout=20m
          kubectl rollout status deployment/frontend --timeout=5m

      # Only on a failed rollout, and only for the deployment that failed to settle.
      # Note what this does and does not undo: the previous image comes back, but a
      # migration or a change already written to the volume does not. This app has
      # no migrations today; when it does, this step stops being sufficient.
      - name: Roll back a failed rollout
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          echo "::error::rollout did not settle — rolling back"
          for deployment in backend frontend; do
            if ! kubectl rollout status "deployment/${deployment}" --timeout=30s >/dev/null 2>&1; then
              kubectl rollout undo "deployment/${deployment}" || true
              kubectl rollout status "deployment/${deployment}" --timeout=3m || true
            fi
          done
          kubectl get pods -o wide

      - name: Read the public address
        id: address
        run: |
          # The LoadBalancer IP is assigned asynchronously; on a first deploy it is
          # empty for a minute or two while Azure provisions it.
          for i in $(seq 1 30); do
            ip="$(kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            [ -n "${ip}" ] && break
            sleep 10
          done
          if [ -z "${ip}" ]; then
            echo "::warning::the frontend Service has no external IP yet; check 'kubectl get svc frontend'"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=http://${ip}" >> "$GITHUB_OUTPUT"

      # Accepted, started, and actually serving are three different claims. This is
      # the third: the app answers through the public address a user would type.
      - name: Smoke-test the deployment
        if: steps.address.outputs.url != ''
        run: |
          url="${{ steps.address.outputs.url }}"
          for i in $(seq 1 30); do
            if curl -fsS "${url}/healthz" -o /dev/null; then
              echo "Frontend is serving after ${i} attempt(s)."
              break
            fi
            sleep 5
          done
          # Through the frontend's own proxy, which is also what proves the two
          # containers can see each other inside the cluster.
          curl -fsS "${url}/api/health" -o health.json
          cat health.json
          grep -q '"status":"ok"' health.json || {
            echo "::error::/api/health answered but did not report ok"
            exit 1
          }

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Deployment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ needs.resolve.outputs.short }}\` |"
            echo "| Stack | ${{ steps.shape.outputs.stack }} |"
            echo "| Provider | ${{ steps.shape.outputs.provider }} |"
            echo "| URL | ${{ steps.address.outputs.url || 'not assigned' }} |"
            echo
            echo '```'
            kubectl get pods -o wide 2>/dev/null || echo "cluster unreachable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
