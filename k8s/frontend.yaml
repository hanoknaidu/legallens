# The UI, and the only thing exposed to the internet.
#
# BACKEND_URL is set here, and it has to be a fully qualified name. The image
# defaults to http://backend:8000, which is correct under Docker Compose because
# Docker's embedded DNS resolves bare service names. In Kubernetes it fails:
# nginx's `resolver` does not apply the `search` domains from /etc/resolv.conf,
# so it queries `backend` as an absolute name, CoreDNS answers NXDOMAIN, and
# every /api/ request is a 502 with "backend could not be resolved" in the log.
# The frontend's own /healthz still passes, because nginx answers that alone —
# so the pod reports Ready while the API is unreachable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: legallens
  labels:
    app: frontend
    app.kubernetes.io/part-of: legal-lens
spec:
  # Stateless, so this one could safely be scaled up — unlike the backend.
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Taken from the pod rather than hardcoded, so the same manifest is
            # correct in whichever namespace it is applied to. Kubernetes expands
            # $(POD_NAMESPACE) because it is declared before the value that uses it.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BACKEND_URL
              value: "http://backend.$(POD_NAMESPACE).svc.cluster.local:8000"
          readinessProbe:
            # Answered by nginx alone, with no call to the backend. A readiness
            # check that reached through to the API would take the whole UI out
            # of service whenever the API was briefly unwell.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: legallens
  labels:
    app: frontend
    app.kubernetes.io/part-of: legal-lens
spec:
  # This is what asks Azure for a public IP. Plain HTTP on port 80, no TLS and no
  # hostname — see CD_readme.md. Do not put real documents through it.
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
