# The UI, and the only thing exposed to the internet.
#
# No BACKEND_URL here on purpose: the image already defaults to
# http://backend:8000, which is exactly the Service name and port defined in
# backend.yaml. Setting it again would be a second place to keep in step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/part-of: legal-lens
spec:
  # Stateless, so this one could safely be scaled up — unlike the backend.
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            # Answered by nginx alone, with no call to the backend. A readiness
            # check that reached through to the API would take the whole UI out
            # of service whenever the API was briefly unwell.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/part-of: legal-lens
spec:
  # This is what asks Azure for a public IP. Plain HTTP on port 80, no TLS and no
  # hostname — see CD_readme.md. Do not put real documents through it.
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
